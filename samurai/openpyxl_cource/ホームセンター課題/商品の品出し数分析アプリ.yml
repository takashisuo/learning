    - data:
        code: "# 引数  sales：過去の売上データ　stock：在庫データ　weather：今日の天気\n\ndef main(sales: str,\
          \ stock: str, weather: str) -> dict:\n    # 過去の売り上げのcsvデータを配列linesに1行ずつ格納する\n\
          \    lines = sales.strip().split('\\n')\n\n    # 今日の天気と一致する売上データを、過去の売上データ（sales）から抽出する\n\
          \    for i in range(len(lines) - 1, 0, -1):\n        # weatherと一致する値が含まれていない行は削除する\n\
          \        line = lines[i]\n        if weather not in line:\n            del\
          \ lines[i]\n    \n    # ディクショナリに各データをresponse_dataに格納して返却する\n    response_data\
          \ = {\n        \"sales\":lines,\n        \"stock\":stock,\n        \"weather\"\
          :weather\n    }\n\n    return {\n        \"result\":str(response_data),\n\
          \    }\n    "
        code_language: python3
        desc: 過去の売上データから、今日の天気と一致するデータのみに絞り込む
        outputs:
          result:
            children: null
            type: string
